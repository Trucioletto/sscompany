<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <!-- The page runs no script and loads nothing off-origin; lock that in. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; img-src 'self'; style-src 'self'; font-src 'self'; base-uri 'none'; form-action 'none'">

  <title>Page not found — Spinne Software</title>

  <!-- A 404 must never be indexed or shared: no canonical, no Open Graph,
       no JSON-LD. Just tell crawlers to leave it out. -->
  <meta name="robots" content="noindex">

  <meta name="theme-color" content="#ffffff">

  <!-- Root-absolute paths (not "style.css") are REQUIRED here. GitHub Pages
       serves this same 404.html for an unknown path at ANY depth
       (e.g. /a/b/c), where a relative "style.css" would resolve to
       /a/b/style.css and 404 in turn. From the site root these always hit
       the real files. index.html can stay relative because it only ever
       loads from "/". -->
  <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="icon" href="/favicon-96.png" type="image/png" sizes="96x96">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">

  <link rel="preload" href="/fonts/inter.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/style.css">
</head>
<body>

  <main class="hero">
    <div class="hero-content">
      <h1 class="visually-hidden">Page not found</h1>
      <!-- Not inlined here, unlike the home page: the 404 is rarely hit, and
           sharing /logo.svg with privacy.html keeps it cacheable. -->
      <img class="logo" src="/logo.svg" alt="Spinne Software" width="216" height="90">
      <p class="description">
        This page does not exist.
      </p>
      <a class="cta" href="/">Back to home</a>
    </div>
  </main>

  <footer>
    <p>
      &copy; 2026 Spinne Software. All rights reserved.<span class="footer-sep">·</span><a href="/privacy.html">Privacy</a>
    </p>
  </footer>

</body>
</html>
